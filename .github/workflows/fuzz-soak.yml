name: fuzz-soak

on:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Fuzz duration in seconds'
        default: '3600'
        required: true
  schedule:
    - cron: '41 2 * * 0'

jobs:
  sanitizer-fuzz:
    name: sanitizer fuzz campaign
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Run fuzz campaign
        env:
          DBS_FUZZ_SECONDS: ${{ github.event.inputs.fuzz_seconds || '3600' }}
        run: bash scripts/run_fuzz_campaign.sh
      - name: Upload fuzz artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-sanitizer-artifacts
          path: validation/release_artifacts/fuzz/**

  cpu-soak:
    name: CPU soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps and wheel
        run: |
          python -m pip install -U -r requirements-dev.txt
          bash scripts/build_wheels.sh --no-isolation
          python -m pip install --force-reinstall dist/*.whl
      - name: CPU soak
        run: python scripts/run_soak_test.py --device cpu --iterations 1000 --out validation/release_artifacts/soak-cpu.json
      - name: Upload soak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpu-soak-artifacts
          path: validation/release_artifacts/soak-cpu.json
