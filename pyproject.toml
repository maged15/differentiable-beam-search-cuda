[build-system]
requires = ["setuptools>=68", "wheel", "torch", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dbs-torch"
dynamic = ["version"]
description = "CPU-autograd and CUDA-forward extension for sparse-surrogate differentiable beam search"
requires-python = ">=3.9"
dependencies = ["torch"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
